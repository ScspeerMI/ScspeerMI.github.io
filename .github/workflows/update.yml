name: Refresh site

# Runs every morning, re-reads every source, rebuilds the page, and commits
# anything that changed. GitHub Pages redeploys from /docs on each push, so a
# piece published on Tuesday is on the site by Wednesday with nobody involved.
on:
  schedule:
    - cron: "17 11 * * *"     # 11:17 UTC daily, roughly 7am Eastern
  workflow_dispatch:           # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources
        run: python fetch.py

      - name: Build page
        run: python build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Refresh site: $(date -u +'%Y-%m-%d')"
            git push
          fi
